plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // Limit ram usage for the dev environment to 4GB
            jvmArgument '-Xmx4G'
            gameDirectory = project.file("runs/${name}")
            sourceSet = sourceSets.gametest
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
            programArgument '--nogui'
        }

        // Plays the client smoke scenario (screenshots, checks) then exits, non-zero on failure. See scripts/client-smoke.sh.
        clientSmoke {
            client()
            systemProperty 'capsule.clientsmoke', 'true'
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        // Runs every capsule GameTest headless then exits, with the number of failed required tests as exit code.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
        }
    }

    mods {
        capsule {
            sourceSet sourceSets.main
        }
        // GameTests and client smoke test, see src/gametest/resources/META-INF/neoforge.mods.toml
        capsule_gametest {
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.capsule
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

configurations {
    gametestCompileOnly.extendsFrom compileOnly
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // recipe viewers: the plugins compile against their APIs, the dev runs load the one picked with -PrecipeViewer
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}") { transitive = false }
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    localRuntime([
            jei : "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}",
            rei : "me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}",
            emi : "dev.emi:emi-neoforge:${emi_version}",
    ][findProperty('recipeViewer') ?: 'jei'])

    // mods Capsule integrates with, exercised by the GameTests
    gametestImplementation "maven.modrinth:security-craft:${securitycraft_version}"
    gametestCompileOnly "maven.modrinth:worldedit:${worldedit_version}"
    gametestCompileOnly "maven.modrinth:open-parties-and-claims:${opac_neoforge_version}"
    gametestCompileOnly "maven.modrinth:flan:${flan_neoforge_version}"

    // mods from issues (#70, #115, #121), opt-in because they slow every dev run down: -PmodCompat
    if (project.hasProperty('modCompat')) {
        gametestRuntimeOnly "maven.modrinth:worldedit:${worldedit_version}"
        gametestRuntimeOnly "maven.modrinth:waystones:${waystones_version}"
        gametestRuntimeOnly "maven.modrinth:balm:${balm_version}"
        gametestRuntimeOnly "maven.modrinth:sophisticated-storage:${sophisticated_storage_version}"
        gametestRuntimeOnly "maven.modrinth:sophisticated-core:${sophisticated_core_version}"
        // claim mods (#91)
        gametestRuntimeOnly "maven.modrinth:open-parties-and-claims:${opac_neoforge_version}"
        gametestRuntimeOnly "maven.modrinth:flan:${flan_neoforge_version}"
    }
}

tasks.named('runGameTestServer') {
    // a fresh world and config on every run keeps results reproducible
    doFirst {
        delete "runs/gameTestServer/world", "runs/gameTestServer/config/capsule", "runs/gameTestServer/initialconfig",
                "runs/gameTestServer/schematics", "runs/gameTestServer/worldedit-schematics"
    }
}

// The GameTests as a mod jar, for real servers and clients next to the release jar (scripts/prod-gametest.sh)
tasks.register('testModJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('test-mod')
}

tasks.named('assemble') {
    dependsOn 'testModJar'
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}
