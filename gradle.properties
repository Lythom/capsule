# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.debug=false

minecraft_version=26.2
capsule_version=10.0
# Overridden by CI: ./gradlew build -Pbuild_id=<build number>
build_id=SNAPSHOT

neo_version=26.2.0.95
# NeoForm (vanilla Minecraft) version of neo_version, used to compile common
neo_form_version=26.2-2
jei_version=30.48.0.244
# REI, the other recipe viewer: the dev runs load one of JEI or REI, picked with -PrecipeViewer=jei|rei
rei_version=26.2.820
# Modrinth version id of SecurityCraft v1.10.2.1 for NeoForge 26.2 (version numbers are shared across loaders)
securitycraft_version=kCkFPvNl
# Modrinth version ids of mods from issues, loaded by the GameTests with -PmodCompat (see docs/TESTING.md)
waystones_version=W4wbeQe7
balm_version=5wreNQrF
sophisticated_storage_version=8NBkbIrX
sophisticated_core_version=vfOZTdtV
# WorldEdit 7.4.5 for 26.2, writes the Sponge schematic fixtures of the GameTests (#70)
worldedit_version=6YnCYPwc

fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
# Modrinth version id of Forge Config API Port 26.2.1 for Fabric 26.2, provides NeoForge's ModConfigSpec
forge_config_api_port_version=rSd3GiG8
# claim mods on Fabric answer through it (jar-in-jar)
common_protection_api_version=2.0.0

# Modrinth version ids of claim mods (#91): the claim GameTests compile against them, -PmodCompat loads them
# Open Parties and Claims 0.33.0 and Flan 1.12.8 for 26.2
opac_neoforge_version=5nVoZqbg
opac_fabric_version=Z5TkbNzv
flan_neoforge_version=H9NbCnik
flan_fabric_version=qJDOZxe5
# Get Off My Lawn ReServed 1.21.0+26.2 (Fabric) and the R-tree its claim API returns
goml_version=ttqMQa3Y
rtree_3i_version=0.3.0

# Modrinth version id of the mod of the known incompatibilities (wiki) loaded by the GameTests with -Pincompat:
# Corail Tombstone 9.9.4 for 26.2. Refined Storage, Mekanism, Immersive Engineering and Super Factory Manager have no
# 26.2 build, their tests are left out of the build (neoforge/build.gradle)
tombstone_version=I34Nt5pp

junit_version=5.11.4
night_config_version=3.8.4

# 26.2 port only: the GameTest and client smoke sources are ported in phase 8 (docs/port-26.2/PLAN.md). Until then
# `build` neither packages nor runs them, and the dev runs load Capsule alone. Phase 8 deletes this flag.
port_gametests_ready=false
