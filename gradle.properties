# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.debug=false

minecraft_version=26.3
capsule_version=11.0
# Overridden by CI: ./gradlew build -Pbuild_id=<build number>
build_id=SNAPSHOT

neo_version=26.3.0.115
# NeoForm (vanilla Minecraft) version of neo_version, used to compile common
neo_form_version=26.3-1
jei_version=31.23.0.129
# REI, the other recipe viewer: the dev runs load one of JEI or REI, picked with -PrecipeViewer=jei|rei
rei_version=26.3.824
# Architectury 22.0.6 for 26.3, the newest: the dev runs take this one rather than the version REI's pom asks for
architectury_version=22.0.6
# Modrinth version id of SecurityCraft v1.10.2.1-beta4 for NeoForge 26.3 (version numbers are shared across loaders)
securitycraft_version=mgxwefx4
# Modrinth version ids of mods from issues, loaded by the GameTests with -PmodCompat (see docs/TESTING.md)
waystones_version=CEfraVFf
balm_version=QcBcRJZb
# Shogi 26.3.0.3, a library Waystones requires since 26.2
shogi_version=wFw6qDQV
sophisticated_storage_version=on0Ziwnf
sophisticated_core_version=8fAHwWo2
# WorldEdit 7.4.6 for 26.3, writes the Sponge schematic fixtures of the GameTests (#70)
worldedit_version=ByRNkO83

fabric_loader_version=0.20.1
fabric_api_version=0.166.2+26.3
# Modrinth version id of Forge Config API Port 26.3.1 for Fabric 26.3, provides NeoForge's ModConfigSpec
forge_config_api_port_version=JpKvrr9J
# claim mods on Fabric answer through it (jar-in-jar)
common_protection_api_version=2.0.0

# Modrinth version ids of claim mods (#91): the claim GameTests compile against them, -PmodCompat loads them
# Open Parties and Claims 0.33.0 and Flan 1.12.9 for 26.3
opac_neoforge_version=VhEuA4pj
opac_fabric_version=KBCCg0os
flan_neoforge_version=TL00Frpw
flan_fabric_version=8PVcH9Li
# Get Off My Lawn ReServed 1.22.0+26.3-rc-1 (Fabric, the only 26.3 build, made for 26.3-rc-1) and the R-tree its claim API returns
goml_version=p3z2M9AO
rtree_3i_version=0.3.0

# Modrinth version ids of the mods of the known incompatibilities (wiki), loaded by the GameTests with -Pincompat: none
# has a 26.3 build (Corail Tombstone, Refined Storage, Mekanism, Immersive Engineering, Super Factory Manager), see
# neoforge/build.gradle

junit_version=5.11.4
night_config_version=3.8.4

