// A loader project compiles the sources of common with its own glue code, and packages the common resources.
plugins {
    id 'multiloader-common'
}

configurations {
    commonJava { canBeResolved = true }
    commonResources { canBeResolved = true }
    commonTestJava { canBeResolved = true }
    commonGametestJava { canBeResolved = true }
    commonGametestResources { canBeResolved = true }
}

dependencies {
    compileOnly project(':common')
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    commonTestJava project(path: ':common', configuration: 'commonTestJava')
    commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
    commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn configurations.commonJava
    source configurations.commonJava
}

tasks.named('processResources', ProcessResources) {
    dependsOn configurations.commonResources
    from configurations.commonResources
}

tasks.named('compileTestJava', JavaCompile) {
    dependsOn configurations.commonTestJava
    source configurations.commonTestJava
}

tasks.named('compileGametestJava', JavaCompile) {
    dependsOn configurations.commonGametestJava
    source configurations.commonGametestJava
}

tasks.named('processGametestResources', ProcessResources) {
    dependsOn configurations.commonGametestResources
    from configurations.commonGametestResources
}

// Modrinth maven coordinates of a mod of the mod-compat runtimes: the version id pinned in gradle.properties, or with
// -PmodCompatLatest the newest version for this loader and Minecraft version
ext.modrinth = { String slug, String pinned ->
    if (!project.hasProperty('modCompatLatest')) return "maven.modrinth:$slug:$pinned"
    def query = "loaders=[\"${project.name}\"]&game_versions=[\"${minecraft_version}\"]".replace('"', '%22').replace('[', '%5B').replace(']', '%5D')
    def connection = URI.create("https://api.modrinth.com/v2/project/$slug/version?$query").toURL().openConnection()
    connection.setRequestProperty('User-Agent', 'Lythom/capsule (contact@samuel-bouchet.fr)')
    def latest = new groovy.json.JsonSlurper().parse(connection.inputStream).first()
    logger.lifecycle("$slug: ${latest.version_number} (${latest.id}), pinned $pinned")
    "maven.modrinth:$slug:${latest.id}"
}
