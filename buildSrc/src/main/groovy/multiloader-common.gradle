// Settings shared by the common and loader projects.
plugins {
    id 'java-library'
}

version = "${minecraft_version}-${capsule_version}.${build_id}"
group = 'fr.samuelbouchet.capsule'
base.archivesName = "Capsule-${project.name}"

java.toolchain.languageVersion = JavaLanguageVersion.of(21) // Mojang ships Java 21 to end users since 1.21

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Jared (JEI)'
                url = 'https://maven.blamejared.com/'
            }
        }
        filter {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    mavenCentral {
        content {
            // served by maven.fabricmc.net
            excludeGroupByRegex 'net\\.fabricmc.*'
        }
    }
}

// GameTests: loaded by the dev runs, never packaged in the release jars.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : 'Capsule',
                'Specification-Vendor'    : 'Lythom',
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : 'capsule',
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'Lythom',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
