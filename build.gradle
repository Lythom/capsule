plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${capsule_version}.${build_id}"
group = "fr.samuelbouchet.capsule" // http://maven.apache.org/guides/mini/guide-naming-conventions.html
base.archivesName = "Capsule"

java.toolchain.languageVersion = JavaLanguageVersion.of(21) // Mojang ships Java 21 to end users since 1.21

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// GameTests: loaded by the dev runs as part of the capsule mod, never packaged in the release jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neo_version

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
            // Limit ram usage for the dev environment to 4GB
            jvmArgument '-Xmx4G'
            gameDirectory = project.file("runs/${name}")
            sourceSet = sourceSets.gametest
        }

        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
            programArgument '--nogui'
        }

        // Runs every capsule GameTest headless then exits, with the number of failed required tests as exit code.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', 'capsule'
        }

        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll '--mod', 'capsule', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        capsule {
            sourceSet sourceSets.main
            sourceSet sourceSets.gametest
        }
    }

    unitTest {
        enable()
        testedMod = mods.capsule
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

repositories {
    maven {
        name = 'Jared (JEI)'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

tasks.named('runGameTestServer') {
    // a fresh world and config on every run keeps results reproducible
    doFirst {
        delete "runs/gameTestServer/world", "runs/gameTestServer/config/capsule"
    }
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "Capsule",
                "Specification-Vendor"    : "Lythom",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "Lythom",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
