version: 2.1
jobs:
  build:
    docker:
      # specify the version you desire here
      - image: cimg/openjdk:17.0

      # Specify service dependencies here if necessary
      # CircleCI maintains a library of pre-built images
      # documented at https://circleci.com/docs/2.0/circleci-images/
      # - image: circleci/postgres:9.4

    working_directory: ~/repo

    environment:
      # Customize the JVM maximum heap limit
      JVM_OPTS: -Xmx3200mk
      TERM: dumb

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "build.gradle" }}
            # fallback to using the latest cache if no exact match is found
            - v1-dependencies-

      - run: echo 'export GRADLE_OPTS="-Dfile.encoding=UTF-8"' >> $BASH_ENV
      - run: rm -rf build/libs
      - run: chmod +x ./gradlew
      - run: sed -i "s/BUILD_ID/${CIRCLE_BUILD_NUM}/g" build.gradle
      - run: ./gradlew build

      - save_cache:
          paths:
            - ~/.gradle
          key: v1-dependencies-{{ checksum "build.gradle" }}

      - store_artifacts:
          path: build/libs
          destination: jars

      - persist_to_workspace:
          root: .
          paths:
            - build/libs
            - publish.sh
            - CHANGELOG.md

  publish:
    docker:
      - image: cimg/python:3.12

    working_directory: ~/repo

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Publish to CurseForge and Modrinth
          command: |
            chmod +x ./publish.sh
            JAR_FILE=$(find build/libs -name "Capsule-*.jar" ! -name "*-sources.jar" | head -1)
            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: No jar found in build/libs/"
              exit 1
            fi
            echo "Publishing: $JAR_FILE"
            ./publish.sh "$JAR_FILE" "${RELEASE_TYPE:-beta}"

# Only version branches (1.20, 1.18...) are built; other branches are built and tested locally.
# A build is published to CurseForge and Modrinth once the hold job is approved in the CircleCI UI.
workflows:
  version: 2
  build_and_publish:
    jobs:
      - build:
          filters:
            branches:
              only: /[0-9]+\..*/
      - hold:
          type: approval
          requires:
            - build
          filters:
            branches:
              only: /[0-9]+\..*/
      - publish:
          requires:
            - hold
          filters:
            branches:
              only: /[0-9]+\..*/
