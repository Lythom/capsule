version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0.8
    resource_class: large

    working_directory: ~/repo

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      - restore_cache:
          keys:
            - v4-dependencies-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - v4-dependencies-

      - run: echo 'export GRADLE_OPTS="-Dfile.encoding=UTF-8"' >> $BASH_ENV
      - run: chmod +x ./gradlew
      # unit tests and GameTests of both loaders run in check
      - run: ./gradlew build -Pbuild_id=${CIRCLE_BUILD_NUM} --stacktrace

      - save_cache:
          paths:
            - ~/.gradle
          key: v4-dependencies-{{ checksum "gradle.properties" }}-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}

      - store_test_results:
          path: neoforge/build/test-results

      - store_test_results:
          path: fabric/build/test-results

      - store_test_results:
          path: fabric/build/gametest

      - store_artifacts:
          path: neoforge/build/libs
          destination: jars/neoforge

      - store_artifacts:
          path: fabric/build/libs
          destination: jars/fabric

      - persist_to_workspace:
          root: .
          paths:
            - neoforge/build/libs
            - fabric/build/libs
            - publish.sh
            - CHANGELOG.md

  publish:
    docker:
      - image: cimg/python:3.12

    working_directory: ~/repo

    steps:
      - attach_workspace:
          at: .

      - run:
          name: Publish to CurseForge and Modrinth
          command: |
            chmod +x ./publish.sh
            for LOADER in neoforge fabric; do
              JAR_FILE=$(find $LOADER/build/libs -name "Capsule-$LOADER-*.jar" ! -name "*-sources.jar" | head -1)
              if [ -z "$JAR_FILE" ]; then
                echo "ERROR: No $LOADER jar found in $LOADER/build/libs/"
                exit 1
              fi
              echo "Publishing: $JAR_FILE"
              ./publish.sh "$JAR_FILE" "${RELEASE_TYPE:-beta}"
            done

# Only the 1.21.1 branch is built; other branches are built and tested locally (see docs/TESTING.md).
workflows:
  version: 2
  build_and_publish:
    jobs:
      - build:
          filters:
            branches:
              only: 1.21.1
      - hold:
          type: approval
          requires:
            - build
          filters:
            branches:
              only: 1.21.1
      - publish:
          requires:
            - hold
          filters:
            branches:
              only: 1.21.1
