plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
        content {
            includeGroup 'org.parchmentmc.data'
        }
    }
    maven {
        name = 'Nucleoid (Common Protection API)'
        url = 'https://maven.nucleoid.xyz/'
        content {
            includeGroup 'eu.pb4'
        }
    }
}

// mod<Gametest...> configurations, remapped like the main mod dependencies
loom.createRemapConfigurations(sourceSets.gametest)

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modImplementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    modImplementation include("eu.pb4:common-protection-api:${common_protection_api_version}")
    // bundled in Forge Config API Port, whose nested jars are not loaded by the dev runs
    implementation "com.electronwill.night-config:core:${night_config_version}"
    runtimeOnly "com.electronwill.night-config:toml:${night_config_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // JEI for Fabric is built with a Loom version that needs Java 25: compiled against its common API only
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"

    // claim mods (#91): the claim GameTests compile against them, opt-in at runtime with -PmodCompat
    modGametestCompileOnly "maven.modrinth:open-parties-and-claims:${opac_fabric_version}"
    modGametestCompileOnly "maven.modrinth:flan:${flan_fabric_version}"
    if (project.hasProperty('modCompat')) {
        modGametestRuntimeOnly "maven.modrinth:open-parties-and-claims:${opac_fabric_version}"
        modGametestRuntimeOnly "maven.modrinth:flan:${flan_fabric_version}"
    }
}

sourceSets.gametest {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

loom {
    accessWidenerPath = file('src/main/resources/capsule.accesswidener')
    mods {
        capsule {
            sourceSet sourceSets.main
        }
        // dev only mod holding the GameTests, see src/gametest/resources/fabric.mod.json
        'capsule-gametest' {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            source sourceSets.gametest
            vmArg '-Xmx4G'
        }
        client {
            client()
            runDir 'runs/client'
        }
        server {
            server()
            runDir 'runs/server'
        }
        // Plays the client smoke scenario (screenshots, checks) then exits, non-zero on failure. See scripts/client-smoke.sh.
        clientSmoke {
            client()
            runDir 'runs/clientSmoke'
            vmArg '-Dcapsule.clientsmoke=true'
            programArgs '--width', '1280', '--height', '720'
        }
        // Runs every capsule GameTest headless then exits, non-zero if a required test failed.
        gameTestServer {
            server()
            runDir 'runs/gameTestServer'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/report.xml')}"
        }
    }
}

processResources {
    def properties = [version: version]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.named('runGameTestServer') {
    // a fresh world and config on every run keeps results reproducible
    doFirst {
        delete 'runs/gameTestServer/world', 'runs/gameTestServer/config/capsule', 'runs/gameTestServer/initialconfig',
                'runs/gameTestServer/schematics'
    }
}

tasks.named('check') {
    dependsOn 'runGameTestServer'
}

test {
    // Fabric Loader writes its logs in the working directory
    workingDir = file('build/junit')
    doFirst {
        workingDir.mkdirs()
    }
}
