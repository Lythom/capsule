plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Nucleoid (Common Protection API)'
        url = 'https://maven.nucleoid.xyz/'
        content {
            includeGroup 'eu.pb4'
        }
    }
    maven {
        name = 'JamiesWhiteShirt (R-tree of Get Off My Lawn)'
        url = 'https://maven.jamieswhiteshirt.com/libs-release/'
        content {
            includeGroup 'com.jamieswhiteshirt'
        }
    }
}

dependencies {
    // Minecraft 26.x is not obfuscated: no mappings, nothing is remapped
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "maven.modrinth:forge-config-api-port:${forge_config_api_port_version}"
    implementation include("eu.pb4:common-protection-api:${common_protection_api_version}")
    // the common config code compiles against night-config; at runtime the copy nested in Forge Config API Port is used
    compileOnly "com.electronwill.night-config:core:${night_config_version}"
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    // recipe viewers: the plugins compile against their APIs, the dev runs load the one picked with -PrecipeViewer
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${rei_version}") { transitive = false }
    localRuntime([
            jei : ["mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"],
            rei : ["me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"],
    ][findProperty('recipeViewer') ?: 'jei'])

    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"

    // the protection mods whose API Capsule calls when they are loaded (#91, #119); SecurityCraft has no Fabric build,
    // its NeoForge API compiles the common check, never loaded on Fabric
    compileOnly("maven.modrinth:open-parties-and-claims:${opac_fabric_version}") { transitive = false }
    compileOnly("maven.modrinth:flan:${flan_fabric_version}") { transitive = false }
    compileOnly("maven.modrinth:goml-reserved:${goml_version}") { transitive = false }
    compileOnly "com.jamieswhiteshirt:rtree-3i-lite-fabric:${rtree_3i_version}"
    compileOnly("maven.modrinth:security-craft:${securitycraft_version}") { transitive = false }
    // the claim GameTests run with them with -PmodCompat
    if (project.hasProperty('modCompat')) {
        gametestRuntimeOnly modrinth('open-parties-and-claims', opac_fabric_version)
        gametestRuntimeOnly modrinth('flan', flan_fabric_version)
    }
}

sourceSets.gametest {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

// false until the GameTests are ported to 26.2, see gradle.properties
def gametestsReady = port_gametests_ready.toBoolean()

loom {
    accessWidenerPath = file('src/main/resources/capsule.accesswidener')
    mods {
        capsule {
            sourceSet sourceSets.main
        }
        // dev only mod holding the GameTests, see src/gametest/resources/fabric.mod.json
        if (gametestsReady) {
            'capsule-gametest' {
                sourceSet sourceSets.gametest
            }
        }
    }
    runs {
        configureEach {
            source gametestsReady ? sourceSets.gametest : sourceSets.main
            vmArg '-Xmx4G'
        }
        client {
            client()
            runDir 'runs/client'
        }
        server {
            server()
            runDir 'runs/server'
        }
        // Plays the client smoke scenario (screenshots, checks) then exits, non-zero on failure. See scripts/client-smoke.sh.
        clientSmoke {
            client()
            runDir 'runs/clientSmoke'
            vmArg '-Dcapsule.clientsmoke=true'
            programArgs '--width', '1280', '--height', '720'
            // staged scenes recorded for the changelog instead of the smoke scenario, see scripts/showcase.sh
            if (project.hasProperty('showcase')) {
                vmArg '-Dcapsule.showcase=true'
                vmArg "-Dcapsule.showcase.scenes=${project.property('showcase')}"
            }
        }
        // Runs every capsule GameTest headless then exits, non-zero if a required test failed.
        gameTestServer {
            server()
            runDir 'runs/gameTestServer'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.file('build/gametest/report.xml')}"
            // adds ClaimProbeBenchmark, see docs/CLAIMS.md
            if (project.hasProperty('claimBenchmark')) vmArg '-Dcapsule.gametest.claimBenchmark=true'
        }
    }
}

processResources {
    def properties = [version: version]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

tasks.named('runGameTestServer') {
    // a fresh world and config on every run keeps results reproducible
    doFirst {
        delete 'runs/gameTestServer/world', 'runs/gameTestServer/config/capsule', 'runs/gameTestServer/initialconfig',
                'runs/gameTestServer/schematics'
    }
}

// The GameTests as a mod jar, for real servers and clients next to the release jar (scripts/prod-gametest.sh). Nothing
// is remapped since Minecraft 26.1: a plain jar of the classes
tasks.register('testModJar', Jar) {
    from sourceSets.gametest.output
    archiveClassifier = 'gametest'
    destinationDirectory = layout.buildDirectory.dir('test-mod')
}

if (gametestsReady) {
    tasks.named('assemble') {
        dependsOn 'testModJar'
    }

    tasks.named('check') {
        dependsOn 'runGameTestServer'
    }
}

test {
    // Fabric Loader writes its logs in the working directory
    workingDir = file('build/junit')
    doFirst {
        workingDir.mkdirs()
    }
}
